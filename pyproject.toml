[project]
name = "citd-image-processing"
version = "0.1.0"
description = "YOLO and OCR pipeline for Vietnamese vehicle license plate recognition"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
vision = [
    "ultralytics>=8.3",
]
ocr = [
    "easyocr>=1.7.2",
    "pytesseract>=0.3.13",
]
paddle = [
    "paddleocr>=3.0; platform_machine == 'x86_64' or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "paddlepaddle>=3.0; platform_machine == 'x86_64' or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[project.scripts]
lpr = "lpr.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpr"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
